<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 音樂排程管理後台</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .admin-container {
            max-width: 700px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #4A90E2;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .card {
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .card h2 {
            color: #6ab0ff;
            font-size: 17px;
            margin-top: 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #aaa;
        }
        input[type="date"], input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #0f3460;
            background: #0f3460;
            color: #fff;
            font-size: 14px;
            margin-bottom: 12px;
            font-family: inherit;
        }
        input[type="date"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: #4A90E2;
        }
        .date-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .date-row > div {
            flex: 1;
        }
        .date-row input {
            margin-bottom: 0;
        }
        .quick-dates {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        .quick-btn {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #0f3460;
            background: #0f3460;
            color: #aaa;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .quick-btn:hover {
            background: #1a4a7a;
            color: #fff;
        }
        .song-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }
        .song-checkbox {
            position: relative;
        }
        .song-checkbox input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }
        .song-checkbox label {
            display: block;
            padding: 8px 4px;
            background: #0f3460;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            color: #ccc;
            border: 2px solid transparent;
            transition: all 0.2s;
            margin: 0;
        }
        .song-checkbox input:checked + label {
            background: #4A90E2;
            color: #fff;
            border-color: #6ab0ff;
            font-weight: bold;
        }
        .song-checkbox label:hover {
            background: #1a4a7a;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            margin-bottom: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4A90E2, #6ab0ff);
            color: #fff;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(74,144,226,0.5);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            background: #0f3460;
            color: #ccc;
        }
        .btn-secondary:hover {
            background: #1a4a7a;
        }
        .btn-warning {
            background: linear-gradient(135deg, #f39c12, #f1c40f);
            color: #fff;
        }
        .btn-warning:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(243,156,18,0.5);
        }
        .btn-warning:active {
            transform: scale(0.98);
        }
        .btn-danger {
            background: #c0392b;
            color: #fff;
        }
        .btn-danger:hover {
            background: #e74c3c;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn-row .btn {
            margin-bottom: 0;
            flex: 1;
        }
        /* 編輯模式提示 */
        .edit-mode-banner {
            display: none;
            background: linear-gradient(135deg, #f39c12, #f1c40f);
            color: #fff;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .edit-mode-banner.show {
            display: flex;
        }
        .edit-mode-banner .cancel-edit {
            background: rgba(0,0,0,0.3);
            color: #fff;
            border: none;
            border-radius: 15px;
            padding: 4px 12px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }
        .edit-mode-banner .cancel-edit:hover {
            background: rgba(0,0,0,0.5);
        }
        /* 排程列表 */
        .schedule-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .schedule-item {
            background: #0f3460;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .schedule-item.editing {
            border: 2px solid #f39c12;
            box-shadow: 0 0 15px rgba(243,156,18,0.4);
        }
        .schedule-item .info {
            flex: 1;
            min-width: 0;
        }
        .schedule-item .date {
            font-weight: bold;
            color: #6ab0ff;
            font-size: 14px;
        }
        .schedule-item .songs-preview {
            font-size: 12px;
            color: #aaa;
            word-break: break-all;
            margin-top: 4px;
        }
        .schedule-item .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .schedule-item .edit-btn {
            background: #f39c12;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            font-weight: bold;
        }
        .schedule-item .edit-btn:hover {
            background: #e67e22;
        }
        .schedule-item .delete-btn {
            background: #c0392b;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            flex-shrink: 0;
            font-family: inherit;
            font-weight: bold;
        }
        .schedule-item .delete-btn:hover {
            background: #e74c3c;
        }
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #27ae60;
            color: #fff;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            z-index: 9999;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
        }
        #toast.error {
            background: #c0392b;
        }
        .empty-hint {
            text-align: center;
            color: #666;
            font-size: 13px;
            padding: 20px;
        }
        .loading {
            text-align: center;
            color: #6ab0ff;
            padding: 20px;
        }
        .info-box {
            background: rgba(74,144,226,0.1);
            border-left: 3px solid #4A90E2;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>🎵 音樂排程管理後台</h1>
    <div class="subtitle">靠北達德速度版｜設定特定日期播放指定歌曲</div>

    <!-- 新增/編輯排程 -->
    <div class="card">
        <h2 id="form-title">➕ 新增排程（可多天）</h2>
        
        <!-- 編輯模式提示 -->
        <div class="edit-mode-banner" id="edit-banner">
            <span>✏️ 編輯模式：<span id="edit-date-label"></span></span>
            <button class="cancel-edit" onclick="cancelEdit()">取消編輯</button>
        </div>
        
        <div class="info-box" id="form-info">
            📌 選擇「開始日期」和「結束日期」，一次把這幾天都設成同一批歌。<br>
            📌 如果只設一天，把開始和結束都選同一天即可。<br>
            📌 當天主頁面就會播這些歌，排完之後才隨機。
        </div>
        
        <div class="date-row">
            <div>
                <label>開始日期</label>
                <input type="date" id="start-date">
            </div>
            <div>
                <label>結束日期</label>
                <input type="date" id="end-date">
            </div>
        </div>
        
        <div class="quick-dates">
            <button class="quick-btn" onclick="setToday()">今天</button>
            <button class="quick-btn" onclick="setTomorrow()">明天</button>
            <button class="quick-btn" onclick="setNextWeek()">未來 7 天</button>
            <button class="quick-btn" onclick="setNextMonth()">未來 30 天</button>
            <button class="quick-btn" onclick="setThisWeekend()">這週末</button>
        </div>
        
        <label>勾選歌曲（可多選）</label>
        <div class="song-grid" id="song-grid">
            <!-- 由 JS 動態產生 -->
        </div>
        
        <button class="btn btn-primary" id="save-btn" onclick="saveSchedule()">💾 儲存排程</button>
        <button class="btn btn-secondary" onclick="selectAllSongs()">✅ 全選</button>
        <button class="btn btn-secondary" onclick="clearAllSongs()">⬜ 全部取消</button>
    </div>

    <!-- 現有排程 -->
    <div class="card">
        <h2>📋 現有排程</h2>
        <div class="schedule-list" id="schedule-list">
            <div class="loading">載入中...</div>
        </div>
    </div>

    <!-- 預設歌單 -->
    <div class="card">
        <h2>🎼 預設歌單（無排程時播放）</h2>
        <div class="info-box">
            📌 這是沒有設定排程時，主頁面會播放的歌曲。預設為全部 30 首隨機播放。<br>
            📌 按下「🔄 還原預設」會把歌單恢復成全部 30 首。
        </div>
        <div class="song-grid" id="default-grid">
            <!-- 由 JS 動態產生 -->
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" onclick="saveDefault()">💾 儲存預設歌單</button>
            <button class="btn btn-warning" onclick="resetDefault()">🔄 還原預設</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script>
    /* ===== Firebase 設定 ===== */
    const firebaseConfig = {
        databaseURL: "https://total-views-969ba-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const scheduleRef = db.ref('music_schedule');

    /* ===== 全部歌曲清單（30首） ===== */
    const allSongs = [
        '01.mp3', '02.mp3', '03.mp3', '04.mp3', '05.mp3',
        '06.mp3', '07.mp3', '08.mp3', '09.mp3', '10.mp3',
        '11.mp3', '12.mp3', '13.mp3', '14.mp3', '15.mp3',
        '16.mp3', '17.mp3', '18.mp3', '19.mp3', '20.mp3',
        '21.mp3', '22.mp3', '23.mp3', '24.mp3', '25.mp3',
        '26.mp3', '27.mp3', '28.mp3', '29.mp3', '30.mp3'
    ];

    /* ===== 編輯狀態 ===== */
    let editingDate = null; // null = 新增模式，有值 = 編輯模式

    /* ===== Toast 提示 ===== */
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = isError ? 'error show' : 'show';
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    /* ===== 日期工具 ===== */
    function formatDate(date) {
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    function getDateRange(startStr, endStr) {
        const dates = [];
        const start = new Date(startStr);
        const end = new Date(endStr);
        if (start > end) return dates;
        const current = new Date(start);
        while (current <= end) {
            dates.push(formatDate(current));
            current.setDate(current.getDate() + 1);
        }
        return dates;
    }

    /* ===== 快速選日期 ===== */
    function setToday() {
        const t = formatDate(new Date());
        document.getElementById('start-date').value = t;
        document.getElementById('end-date').value = t;
    }
    function setTomorrow() {
        const d = new Date();
        d.setDate(d.getDate() + 1);
        const t = formatDate(d);
        document.getElementById('start-date').value = t;
        document.getElementById('end-date').value = t;
    }
    function setNextWeek() {
        const s = new Date();
        const e = new Date();
        e.setDate(e.getDate() + 6);
        document.getElementById('start-date').value = formatDate(s);
        document.getElementById('end-date').value = formatDate(e);
    }
    function setNextMonth() {
        const s = new Date();
        const e = new Date();
        e.setDate(e.getDate() + 29);
        document.getElementById('start-date').value = formatDate(s);
        document.getElementById('end-date').value = formatDate(e);
    }
    function setThisWeekend() {
        const today = new Date();
        const dayOfWeek = today.getDay();
        const saturday = new Date(today);
        const daysUntilSat = (6 - dayOfWeek + 7) % 7;
        saturday.setDate(saturday.getDate() + daysUntilSat);
        const sunday = new Date(saturday);
        sunday.setDate(sunday.getDate() + 1);
        document.getElementById('start-date').value = formatDate(saturday);
        document.getElementById('end-date').value = formatDate(sunday);
    }

    /* ===== 產生歌曲勾選格 ===== */
    function buildSongGrid(containerId, namePrefix) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        allSongs.forEach((song, i) => {
            const num = String(i + 1).padStart(2, '0');
            const div = document.createElement('div');
            div.className = 'song-checkbox';
            div.innerHTML = `
                <input type="checkbox" id="${namePrefix}-${num}" value="${song}">
                <label for="${namePrefix}-${num}">${num}</label>
            `;
            container.appendChild(div);
        });
    }

    buildSongGrid('song-grid', 'song');
    buildSongGrid('default-grid', 'default');

    /* ===== 全選 / 全取消 ===== */
    function selectAllSongs() {
        document.querySelectorAll('#song-grid input[type="checkbox"]').forEach(cb => cb.checked = true);
    }
    function clearAllSongs() {
        document.querySelectorAll('#song-grid input[type="checkbox"]').forEach(cb => cb.checked = false);
    }

    /* ===== 取得勾選的歌曲 ===== */
    function getCheckedSongs(containerId) {
        const checked = [];
        document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`).forEach(cb => {
            checked.push(cb.value);
        });
        return checked.sort();
    }

    /* ===== 🔥 進入編輯模式 ===== */
    function editSchedule(date) {
        // 從 Firebase 讀取該日期的歌單
        scheduleRef.child(date).once('value').then((snapshot) => {
            const songList = snapshot.val() || [];
            
            if (songList.length === 0) {
                showToast('此排程已不存在', true);
                loadSchedules();
                return;
            }
            
            // 設定編輯狀態
            editingDate = date;
            
            // 帶入日期（開始 = 結束 = 該日期）
            document.getElementById('start-date').value = date;
            document.getElementById('end-date').value = date;
            
            // 清空並勾選歌曲
            document.querySelectorAll('#song-grid input[type="checkbox"]').forEach(cb => {
                cb.checked = songList.includes(cb.value);
            });
            
            // 更新 UI
            document.getElementById('form-title').textContent = '✏️ 編輯排程';
            document.getElementById('edit-banner').classList.add('show');
            document.getElementById('edit-date-label').textContent = date;
            document.getElementById('save-btn').textContent = '💾 更新排程';
            document.getElementById('form-info').innerHTML = 
                '📌 修改日期或歌曲後，按「💾 更新排程」儲存。<br>' +
                '📌 如果改成多天，會把這個區間內每一天都設成這批歌。<br>' +
                '📌 原本的排程會被覆蓋。';
            
            // 標記正在編輯的項目
            document.querySelectorAll('.schedule-item').forEach(item => {
                item.classList.remove('editing');
                if (item.dataset.date === date) {
                    item.classList.add('editing');
                }
            });
            
            // 捲動到表單
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            showToast(`✏️ 正在編輯 ${date} 的排程`);
        }).catch((err) => {
            console.error(err);
            showToast('讀取失敗：' + err.message, true);
        });
    }

    /* ===== 🔥 取消編輯 ===== */
    function cancelEdit() {
        editingDate = null;
        
        // 清空表單
        document.getElementById('start-date').value = '';
        document.getElementById('end-date').value = '';
        clearAllSongs();
        
        // 更新 UI
        document.getElementById('form-title').textContent = '➕ 新增排程（可多天）';
        document.getElementById('edit-banner').classList.remove('show');
        document.getElementById('save-btn').textContent = '💾 儲存排程';
        document.getElementById('form-info').innerHTML = 
            '📌 選擇「開始日期」和「結束日期」，一次把這幾天都設成同一批歌。<br>' +
            '📌 如果只設一天，把開始和結束都選同一天即可。<br>' +
            '📌 當天主頁面就會播這些歌，排完之後才隨機。';
        
        // 移除編輯標記
        document.querySelectorAll('.schedule-item').forEach(item => {
            item.classList.remove('editing');
        });
        
        showToast('已取消編輯');
    }

    /* ===== 儲存排程（新增 / 更新） ===== */
    function saveSchedule() {
        const startDate = document.getElementById('start-date').value;
        const endDate = document.getElementById('end-date').value;
        
        if (!startDate || !endDate) {
            showToast('請選擇開始與結束日期！', true);
            return;
        }
        
        if (startDate > endDate) {
            showToast('開始日期不能大於結束日期！', true);
            return;
        }
        
        const selectedSongs = getCheckedSongs('song-grid');
        if (selectedSongs.length === 0) {
            showToast('請至少勾選一首歌！', true);
            return;
        }
        
        const dates = getDateRange(startDate, endDate);
        if (dates.length === 0) {
            showToast('日期範圍錯誤！', true);
            return;
        }
        
        const updates = {};
        dates.forEach(date => {
            updates[date] = selectedSongs;
        });
        
        // 編輯模式：如果原本的日期不在新範圍內，要刪除原本的
        if (editingDate && !dates.includes(editingDate)) {
            updates[editingDate] = null; // 刪除原日期
        }
        
        scheduleRef.update(updates)
            .then(() => {
                if (editingDate) {
                    showToast(`✅ 已更新排程（${dates.length} 天）`);
                } else {
                    showToast(`✅ 已儲存 ${dates.length} 天的排程（共 ${selectedSongs.length} 首）`);
                }
                cancelEdit();
                loadSchedules();
            })
            .catch((err) => {
                console.error(err);
                showToast('儲存失敗：' + err.message, true);
            });
    }

    /* ===== 儲存預設歌單 ===== */
    function saveDefault() {
        const selectedSongs = getCheckedSongs('default-grid');
        if (selectedSongs.length === 0) {
            showToast('請至少勾選一首歌！', true);
            return;
        }
        
        scheduleRef.child('default').set(selectedSongs)
            .then(() => {
                showToast(`✅ 已儲存預設歌單（${selectedSongs.length} 首）`);
            })
            .catch((err) => {
                console.error(err);
                showToast('儲存失敗：' + err.message, true);
            });
    }

    /* ===== 還原預設歌單 ===== */
    function resetDefault() {
        if (!confirm('確定要將預設歌單還原成全部 30 首嗎？')) return;
        
        scheduleRef.child('default').set(allSongs)
            .then(() => {
                document.querySelectorAll('#default-grid input[type="checkbox"]').forEach(cb => {
                    cb.checked = true;
                });
                showToast('✅ 已還原預設歌單（全部 30 首）');
            })
            .catch((err) => {
                console.error(err);
                showToast('還原失敗：' + err.message, true);
            });
    }

    /* ===== 刪除排程 ===== */
    function deleteSchedule(date) {
        if (!confirm(`確定要刪除 ${date} 的排程嗎？`)) return;
        
        scheduleRef.child(date).remove()
            .then(() => {
                // 如果正在編輯這個日期，取消編輯
                if (editingDate === date) {
                    cancelEdit();
                }
                showToast(`✅ 已刪除 ${date} 的排程`);
                loadSchedules();
            })
            .catch((err) => {
                showToast('刪除失敗：' + err.message, true);
            });
    }

    /* ===== 載入排程列表 ===== */
    function loadSchedules() {
        scheduleRef.on('value', (snapshot) => {
            const data = snapshot.val() || {};
            const listEl = document.getElementById('schedule-list');
            
            const dates = Object.keys(data).filter(k => k !== 'default').sort();
            
            if (dates.length === 0) {
                listEl.innerHTML = '<div class="empty-hint">目前沒有任何排程</div>';
            } else {
                listEl.innerHTML = dates.map(date => {
                    const songList = data[date] || [];
                    const preview = songList.map(s => s.replace('.mp3', '')).join(', ');
                    const isEditing = (editingDate === date);
                    return `
                        <div class="schedule-item ${isEditing ? 'editing' : ''}" data-date="${date}">
                            <div class="info">
                                <div class="date">📅 ${date}${isEditing ? ' ✏️' : ''}</div>
                                <div class="songs-preview">${preview}</div>
                            </div>
                            <div class="actions">
                                <button class="edit-btn" onclick="editSchedule('${date}')">編輯</button>
                                <button class="delete-btn" onclick="deleteSchedule('${date}')">刪除</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            // 載入預設歌單到勾選格
            const defaultSongs = data['default'] || allSongs;
            document.querySelectorAll('#default-grid input[type="checkbox"]').forEach(cb => {
                cb.checked = defaultSongs.includes(cb.value);
            });
        });
    }

    /* ===== 初始化 ===== */
    setToday();
    loadSchedules();
</script>
</body>
</html>
