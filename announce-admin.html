<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>重要訊息管理後台</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; font-family: "Microsoft JhengHei", sans-serif; background: #f2f4f8; color: #333; }
    .box { max-width: 560px; margin: 0 auto 18px; background: #fff; border-radius: 18px; padding: 22px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 16px; text-align: center; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    label { display: block; font-weight: bold; font-size: 14px; margin: 14px 0 6px; }
    input, textarea, select { width: 100%; padding: 10px 12px; font-size: 15px; font-family: inherit; border: 1px solid #ccc; border-radius: 10px; }
    textarea { min-height: 110px; resize: vertical; }
    button { font-family: inherit; font-size: 15px; font-weight: bold; border: none; border-radius: 50px; padding: 11px 20px; cursor: pointer; margin-top: 16px; }
    .primary { background: #4285F4; color: #fff; width: 100%; }
    .danger { background: #fff; color: #d32f2f; border: 2px solid #d32f2f; width: 100%; }
    .ghost { background: #fff; color: #555; border: 1px solid #ccc; padding: 6px 14px; font-size: 13px; margin-top: 0; }
    .hint { font-size: 12px; color: #888; margin-top: 4px; line-height: 1.5; }
    .msg { margin-top: 12px; font-size: 14px; font-weight: bold; text-align: center; min-height: 20px; }
    .ok { color: #1b8a3c; } .err { color: #d32f2f; }
    .current { background: #fafafa; border: 1px dashed #bbb; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
    .hidden { display: none; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: #666; margin-bottom: 14px; word-break: break-all; }
    code { background: #eee; padding: 4px 8px; border-radius: 6px; word-break: break-all; display: block; margin: 8px 0; font-size: 13px; user-select: all; }
</style>
</head>
<body>

<!-- 登入 -->
<div class="box" id="login-box">
    <h1>🔐 重要訊息管理後台</h1>
    <label for="email">管理員 Email</label>
    <input type="email" id="email" autocomplete="username">
    <label for="pw">密碼</label>
    <input type="password" id="pw" autocomplete="current-password" onkeydown="if(event.key==='Enter') login()">
    <button class="primary" onclick="login()">登入</button>
    <div class="msg err" id="login-msg"></div>
</div>

<!-- 已登入但不是管理員 -->
<div class="box hidden" id="denied-box">
    <h1>⛔ 沒有管理權限</h1>
    <div class="topbar"><span id="denied-email"></span><button class="ghost" onclick="logout()">登出</button></div>
    <p style="font-size:14px;line-height:1.7;margin:0">這個帳號已登入，但還不是管理員。請到 Firebase 控制台 → Realtime Database，新增這筆資料：</p>
    <code>admins / <span id="denied-uid"></span> = true</code>
    <p class="hint">（路徑 <b>admins</b> 底下新增名稱為上面那串 UID、值為 <b>true</b>（布林值）的項目，完成後重新整理本頁。）</p>
</div>

<!-- 管理後台 -->
<div id="admin-area" class="hidden">
    <div class="box">
        <div class="topbar"><span id="admin-email"></span><button class="ghost" onclick="logout()">登出</button></div>
        <h1>📢 重要訊息管理後台</h1>
        <h2>目前線上的訊息</h2>
        <div class="current" id="current">讀取中…</div>
        <button class="danger" id="clear-btn" onclick="clearNotice()" style="display:none">🗑️ 下架目前訊息（不再彈窗）</button>
    </div>

    <div class="box">
        <h2>發布新的重要訊息</h2>
        <label for="f-title">標題 *</label>
        <input type="text" id="f-title" maxlength="60" placeholder="例如：校慶活動公告">
        <label for="f-content">內容</label>
        <textarea id="f-content" maxlength="1000" placeholder="可換行，純文字"></textarea>
        <label for="f-url">連結／網頁（選填）</label>
        <input type="text" id="f-url" placeholder="https://...　（沒有可留空，使用者只會看到文字）">
        <label for="f-mode">點擊後的開啟方式</label>
        <select id="f-mode">
            <option value="link">新分頁開啟連結</option>
            <option value="page">在本站內開啟網頁（部分網站不允許嵌入，會顯示「新分頁開啟」按鈕備用）</option>
        </select>
        <div class="hint">每次發布都會產生新的編號，所有人（包含已看過舊訊息的人）都會再次收到彈窗。</div>
        <button class="primary" onclick="publish()">🚀 發布</button>
        <div class="msg" id="pub-msg"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script>
    // Firebase 設定（控制台 → 專案設定 → 一般 → 網頁應用程式 → firebaseConfig）
    var firebaseConfig = {
        apiKey: "AIzaSyC82pjOh0FgknrAQShr4iJBYYrFDYTNVDM",
        authDomain: "total-views-969ba.firebaseapp.com",
        projectId: "total-views-969ba",
        databaseURL: "https://total-views-969ba-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();
    var ref = firebase.database().ref('announcements/current');
    var listening = false;

    function $(id) { return document.getElementById(id); }
    function show(id) { ['login-box', 'denied-box', 'admin-area'].forEach(function (x) { $(x).classList.toggle('hidden', x !== id); }); }
    function setMsg(id, text, ok) { var e = $(id); e.textContent = text; e.className = 'msg ' + (ok ? 'ok' : 'err'); }

    var AUTH_ERR = {
        'auth/invalid-email': 'Email 格式不正確',
        'auth/user-not-found': '找不到這個帳號',
        'auth/wrong-password': '密碼錯誤',
        'auth/invalid-credential': 'Email 或密碼錯誤',
        'auth/too-many-requests': '嘗試次數過多，請稍後再試',
        'auth/network-request-failed': '網路連線失敗',
        'auth/api-key-not-valid.-please-pass-a-valid-api-key.': 'apiKey 不正確，請檢查設定'
    };

    function login() {
        if (firebaseConfig.apiKey.indexOf('請貼上') === 0) { setMsg('login-msg', '尚未設定 apiKey，請先編輯本檔案上方的 firebaseConfig', false); return; }
        setMsg('login-msg', '登入中…', true);
        auth.signInWithEmailAndPassword($('email').value.trim(), $('pw').value)
            .then(function () { setMsg('login-msg', '', true); })
            .catch(function (e) { setMsg('login-msg', AUTH_ERR[e.code] || ('登入失敗：' + e.message), false); });
    }
    function logout() { auth.signOut(); }

    auth.onAuthStateChanged(function (user) {
        if (!user) { show('login-box'); return; }
        // 只有 admins/<uid> = true 的帳號才是管理員（寫入權限由 Firebase 規則強制檢查）
        firebase.database().ref('admins/' + user.uid).once('value').then(function (snap) {
            if (snap.val() === true) {
                $('admin-email').textContent = user.email || '';
                show('admin-area');
                listen();
            } else { deny(user); }
        }).catch(function () { deny(user); });
    });

    function deny(user) {
        $('denied-email').textContent = user.email || '';
        $('denied-uid').textContent = user.uid;
        show('denied-box');
    }

    function listen() {
        if (listening) return;
        listening = true;
        ref.on('value', function (snap) {
            var v = snap.val(), box = $('current'), btn = $('clear-btn');
            if (v && v.active !== false && v.id) {
                box.textContent = '標題：' + (v.title || '') + '\n內容：' + (v.content || '（無）') + '\n連結：' + (v.url || '（無）') +
                    '\n開啟方式：' + (v.mode === 'page' ? '站內網頁' : '新分頁') +
                    '\n發布時間：' + new Date(Number(v.id)).toLocaleString('zh-TW');
                btn.style.display = '';
            } else { box.textContent = '目前沒有重要訊息（網站不會彈窗）'; btn.style.display = 'none'; }
        }, function (err) { $('current').textContent = '讀取失敗：' + err.message; });
    }

    function validUrl(u) {
        if (!u) return true;
        try { var x = new URL(u); return x.protocol === 'http:' || x.protocol === 'https:'; } catch (e) { return false; }
    }

    function publish() {
        var title = $('f-title').value.trim(), content = $('f-content').value.trim();
        var url = $('f-url').value.trim(), mode = $('f-mode').value;
        if (!title) { setMsg('pub-msg', '請填寫標題', false); return; }
        if (!validUrl(url)) { setMsg('pub-msg', '連結格式不正確，需以 http:// 或 https:// 開頭', false); return; }
        ref.set({ id: String(Date.now()), title: title, content: content, url: url, mode: mode, active: true })
            .then(function () {
                setMsg('pub-msg', '✅ 已發布！使用者下次打開（或正在瀏覽）網頁就會收到彈窗', true);
                $('f-title').value = ''; $('f-content').value = ''; $('f-url').value = '';
            })
            .catch(function (e) { setMsg('pub-msg', '發布失敗：' + e.message + '（請確認帳號已加入 admins，且 Firebase 規則已設定）', false); });
    }

    function clearNotice() {
        if (!confirm('確定要下架目前的重要訊息嗎？')) return;
        ref.remove().catch(function (e) { alert('下架失敗：' + e.message); });
    }
</script>
</body>
</html>
