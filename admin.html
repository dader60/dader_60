<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒數系統 · 管理員</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
        body { background: #cfe8f7; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1.5rem; }

        /* 登入頁面 */
        .login-container { max-width: 420px; width: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border-radius: 2.5rem; padding: 2.5rem 2.5rem; box-shadow: 0 25px 40px -12px rgba(0,20,30,0.35); border: 1px solid rgba(255,255,255,0.6); }
        .login-container h1 { font-size: 1.8rem; font-weight: 600; color: #1e3b4f; text-align: center; margin-bottom: 0.5rem; }
        .login-container .subhead { text-align: center; color: #4a6f88; margin-bottom: 2rem; font-size: 0.9rem; }
        .login-container .input-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.2rem; }
        .login-container label { font-size: 0.8rem; font-weight: 600; color: #2d5770; }
        .login-container input { background: #f4faff; border: 1.5px solid #cfe1ee; border-radius: 1rem; padding: 0.9rem 1.2rem; font-size: 1rem; color: #0b2a3b; font-weight: 500; }
        .login-container input:focus { outline: none; border-color: #5c9ec7; box-shadow: 0 0 0 3px rgba(92,158,199,0.25); background: white; }
        .login-btn { width: 100%; background: #1e3b4f; border: none; color: white; font-weight: 600; padding: 0.9rem; border-radius: 3rem; font-size: 1rem; cursor: pointer; transition: 0.2s; box-shadow: 0 6px 12px rgba(20,50,70,0.2); margin-top: 0.5rem; }
        .login-btn:hover { background: #0f2c3d; transform: translateY(-2px); }
        .login-error { color: #b33; font-size: 0.85rem; text-align: center; margin-top: 1rem; min-height: 1.2rem; }

        /* 管理頁面 */
        .admin-container { max-width: 1000px; width: 100%; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border-radius: 2.5rem; padding: 2rem 2.5rem; box-shadow: 0 25px 40px -12px rgba(0,20,30,0.35); border: 1px solid rgba(255,255,255,0.6); display: none; }
        .admin-container.active { display: block; }
        h1 { font-size: 2rem; font-weight: 600; color: #1e3b4f; display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
        h1 span { background: #1e3b4f; color: white; font-size: 1rem; padding: 0.25rem 0.9rem; border-radius: 40px; }
        .logout-btn { background: #ffe8e8; border: 1px solid #ffc9c9; color: #b33; font-size: 0.8rem; padding: 0.4rem 1rem; border-radius: 30px; cursor: pointer; font-weight: 600; margin-left: auto; }
        .logout-btn:hover { background: #ffd4d4; }
        .subhead { color: #4a6f88; margin-bottom: 2rem; font-size: 1rem; border-left: 4px solid #7bb3d0; background: rgba(123,179,208,0.1); border-radius: 0 12px 12px 0; padding: 0.8rem 1.2rem; line-height: 1.6; }
        .form-card { background: white; border-radius: 1.8rem; padding: 1.8rem 2rem; box-shadow: 0 8px 18px rgba(0,30,50,0.08); margin-bottom: 2.5rem; border: 1px solid #d9e7f0; }
        .form-row { display: flex; flex-wrap: wrap; gap: 1.2rem; align-items: flex-end; }
        .input-group { flex: 1 1 200px; display: flex; flex-direction: column; gap: 0.4rem; }
        .input-group label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: #2d5770; }
        .input-group input { background: #f4faff; border: 1.5px solid #cfe1ee; border-radius: 1rem; padding: 0.8rem 1.2rem; font-size: 1rem; color: #0b2a3b; font-weight: 500; }
        .input-group input:focus { outline: none; border-color: #5c9ec7; box-shadow: 0 0 0 3px rgba(92,158,199,0.25); background: white; }
        .btn { background: #1e3b4f; border: none; color: white; font-weight: 600; padding: 0.85rem 2.2rem; border-radius: 3rem; font-size: 1rem; cursor: pointer; transition: 0.2s; box-shadow: 0 6px 12px rgba(20,50,70,0.2); white-space: nowrap; }
        .btn:hover { background: #0f2c3d; transform: translateY(-2px); }
        .btn-secondary { background: #e3eef7; color: #1e3b4f; box-shadow: none; border: 1px solid #bbd3e3; }
        .btn-secondary:hover { background: #d1e2f0; }
        .section-title { font-size: 1.3rem; font-weight: 600; color: #1e3b4f; margin-bottom: 1.2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #c6dae7; padding-bottom: 0.7rem; flex-wrap: wrap; gap: 0.5rem; }
        .countdown-list { display: flex; flex-direction: column; gap: 1rem; max-height: 420px; overflow-y: auto; padding-right: 0.4rem; }
        .countdown-item { background: white; border-radius: 1.5rem; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 12px rgba(0,30,50,0.06); border: 1px solid #d4e3ee; flex-wrap: wrap; gap: 0.8rem; }
        .event-info { display: flex; flex-direction: column; gap: 0.25rem; flex: 1 1 200px; }
        .event-name { font-weight: 700; font-size: 1.1rem; color: #0b2a3b; }
        .event-date { font-size: 0.8rem; color: #5b7f97; background: #eef5fb; padding: 0.2rem 0.8rem; border-radius: 30px; width: fit-content; font-weight: 500; }
        .live-preview { font-family: 'SF Mono', monospace; background: #e5f0f7; padding: 0.5rem 1rem; border-radius: 2rem; font-size: 0.9rem; font-weight: 600; color: #17445e; white-space: nowrap; }
        .delete-btn { background: #ffe8e8; border: none; color: #b33; font-size: 0.75rem; padding: 0.35rem 0.9rem; border-radius: 30px; cursor: pointer; font-weight: 600; border: 1px solid #ffc9c9; }
        .delete-btn:hover { background: #ffd4d4; }
        .admin-note { background: #f7f1e1; border-radius: 1rem; padding: 0.9rem 1.5rem; font-size: 0.9rem; color: #6a5c3a; border: 1px solid #e7dcc6; margin-top: 1rem; }
        .empty-state { text-align: center; padding: 2rem; color: #7b98ab; background: #f4faff; border-radius: 1.5rem; }
        .status-badge { font-size: 0.8rem; padding: 0.3rem 0.9rem; border-radius: 30px; font-weight: 600; }
        .status-online { background: #e3f5e9; color: #2d7a4b; border: 1px solid #b8e0c4; }
        .status-offline { background: #ffe8e8; color: #b33; border: 1px solid #ffc9c9; }
        .recurring-item { background: #fffbf2; border: 1px dashed #ffd98a; }
        .recurring-tag { font-size: 0.7rem; background: #fff4e0; color: #a86a1a; padding: 0.15rem 0.6rem; border-radius: 20px; font-weight: 600; border: 1px solid #ffe0b0; margin-left: 0.4rem; }

        /* 密碼變更區 */
        .settings-card { background: #f8fbff; border-radius: 1.5rem; padding: 1.5rem 2rem; border: 1px solid #d9e7f0; margin-top: 2rem; }
        .settings-card h3 { font-size: 1.1rem; color: #1e3b4f; margin-bottom: 1rem; }
        .settings-row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; }
        .settings-row .input-group { flex: 1 1 180px; }
        .settings-msg { font-size: 0.85rem; margin-top: 0.8rem; min-height: 1.2rem; }

        @media (max-width: 600px) {
            .admin-container { padding: 1.5rem 1.2rem; border-radius: 1.8rem; }
            h1 { font-size: 1.5rem; }
            .form-card { padding: 1.2rem 1.2rem; }
            .live-preview { font-size: 0.8rem; padding: 0.4rem 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- ===== 登入頁面 ===== -->
    <div class="login-container" id="loginPage">
        <h1>🔐 管理員登入</h1>
        <div class="subhead">請輸入帳號密碼以進入管理系統</div>
        <div class="input-group">
            <label>帳號</label>
            <input type="text" id="loginUser" placeholder="請輸入帳號" autocomplete="username">
        </div>
        <div class="input-group">
            <label>密碼</label>
            <input type="password" id="loginPass" placeholder="請輸入密碼" autocomplete="current-password">
        </div>
        <button class="login-btn" id="loginBtn">登入</button>
        <div class="login-error" id="loginError"></div>
    </div>

    <!-- ===== 管理頁面 ===== -->
    <div class="admin-container" id="adminPage">
        <h1>
            ⏳ 倒數管理員 <span>ADMIN</span>
            <button class="logout-btn" id="logoutBtn">登出</button>
        </h1>
        <div class="subhead">
            ➕ 新增倒數事件 · 所有裝置即時同步<br>
            🔒 固定節日自動輪迴（元旦、和平紀念日、國慶日、版主生日）
        </div>

        <div class="form-card">
            <div class="form-row">
                <div class="input-group">
                    <label>📌 事件名稱</label>
                    <input type="text" id="eventName" placeholder="例如：聖誕節、專案截止" maxlength="40">
                </div>
                <div class="input-group">
                    <label>📅 日期</label>
                    <input type="date" id="eventDate">
                </div>
                <button class="btn" id="addBtn">＋ 新增倒數</button>
            </div>
        </div>

        <div class="section-title">
            <span>📋 目前倒數事件（即時預覽）</span>
            <span id="statusBadge" class="status-badge status-offline">連線中…</span>
        </div>
        <div id="adminCountdownList" class="countdown-list"></div>
        <div class="admin-note">
            💡 新增或刪除事件後，公開頁面會即時同步更新。橘色虛線框為固定節日（自動輪迴），無法刪除。
        </div>

        <!-- 密碼變更區 -->
        <div class="settings-card">
            <h3>🔑 變更管理員密碼</h3>
            <div class="settings-row">
                <div class="input-group">
                    <label>目前密碼</label>
                    <input type="password" id="oldPass" placeholder="請輸入目前密碼">
                </div>
                <div class="input-group">
                    <label>新密碼</label>
                    <input type="password" id="newPass" placeholder="請輸入新密碼">
                </div>
                <div class="input-group">
                    <label>確認新密碼</label>
                    <input type="password" id="confirmPass" placeholder="請再次輸入新密碼">
                </div>
                <button class="btn btn-secondary" id="changePassBtn">變更密碼</button>
            </div>
            <div class="settings-msg" id="settingsMsg"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, remove, get, set }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // ========== 您的 Firebase 設定 ==========
        const firebaseConfig = {
            apiKey: "AIzaSyBqxkKFETcINEbnuDN7KxGyqsbdntvPd4c",
            authDomain: "countdown-system-d8ad6.firebaseapp.com",
            databaseURL: "https://countdown-system-d8ad6-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "countdown-system-d8ad6",
            storageBucket: "countdown-system-d8ad6.firebasestorage.app",
            messagingSenderId: "1077561154299",
            appId: "1:1077561154299:web:52f82e19f178e8203cae5e",
            measurementId: "G-SJHM41JX6F"
        };
        // ========================================

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const eventsRef = ref(db, 'events');
        const authRef = ref(db, 'auth');

        // 固定節日（自動輪迴，無法刪除）
        const RECURRING_EVENTS = [
            { id: 'rec_1', name: '元旦', month: 1, day: 1 },
            { id: 'rec_2', name: '和平紀念日', month: 2, day: 28 },
            { id: 'rec_3', name: '國慶日', month: 10, day: 10 },
            { id: 'rec_4', name: '版主生日', month: 10, day: 10 }
        ];

        let adminEvents = [];
        let isLoggedIn = false;

        // ---------- 登入邏輯 ----------
        async function checkAndInitAuth() {
            const snapshot = await get(authRef);
            if (!snapshot.exists()) {
                // 第一次使用：建立預設帳號 dader60 / 密碼 dader60
                await set(authRef, { username: 'dader60', password: 'dader60' });
                console.log('已建立預設管理員帳號 dader60 / dader60');
            }
        }

        async function login() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';

            if (!user || !pass) {
                errorEl.textContent = '請輸入帳號與密碼';
                return;
            }

            await checkAndInitAuth();

            const snapshot = await get(authRef);
            const auth = snapshot.val();
            if (!auth) {
                errorEl.textContent = '系統錯誤，請稍後再試';
                return;
            }

            if (user === auth.username && pass === auth.password) {
                isLoggedIn = true;
                sessionStorage.setItem('admin_logged_in', 'true');
                showAdminPage();
            } else {
                errorEl.textContent = '帳號或密碼錯誤';
            }
        }

        function logout() {
            isLoggedIn = false;
            sessionStorage.removeItem('admin_logged_in');
            document.getElementById('adminPage').classList.remove('active');
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginError').textContent = '';
        }

        function showAdminPage() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPage').classList.add('active');
            renderAdminList();
        }

        // ---------- 密碼變更 ----------
        async function changePassword() {
            const oldPass = document.getElementById('oldPass').value;
            const newPass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;
            const msg = document.getElementById('settingsMsg');
            msg.textContent = '';
            msg.style.color = '#b33';

            if (!oldPass || !newPass || !confirmPass) {
                msg.textContent = '請填寫所有欄位';
                return;
            }
            if (newPass !== confirmPass) {
                msg.textContent = '新密碼與確認密碼不一致';
                return;
            }
            if (newPass.length < 4) {
                msg.textContent = '新密碼長度至少 4 個字元';
                return;
            }

            const snapshot = await get(authRef);
            const auth = snapshot.val();
            if (oldPass !== auth.password) {
                msg.textContent = '目前密碼錯誤';
                return;
            }

            await set(authRef, { username: auth.username, password: newPass });
            msg.style.color = '#2d7a4b';
            msg.textContent = '✅ 密碼已成功變更，所有裝置同步生效！';
            document.getElementById('oldPass').value = '';
            document.getElementById('newPass').value = '';
            document.getElementById('confirmPass').value = '';
        }

        // ---------- 倒數邏輯 ----------
        function getNextRecurringDate(month, day) {
            const now = new Date();
            const year = now.getFullYear();
            let target = new Date(year, month - 1, day, 0, 0, 0);
            if (target <= now) {
                target = new Date(year + 1, month - 1, day, 0, 0, 0);
            }
            return target;
        }

        function getRecurringEventsWithDate() {
            return RECURRING_EVENTS.map(ev => {
                const target = getNextRecurringDate(ev.month, ev.day);
                const y = target.getFullYear();
                const m = String(target.getMonth() + 1).padStart(2, '0');
                const d = String(target.getDate()).padStart(2, '0');
                return { id: ev.id, name: ev.name, date: `${y}-${m}-${d}`, recurring: true };
            });
        }

        function getCountdownParts(dateStr) {
            const now = new Date();
            const target = new Date(dateStr + 'T00:00:00');
            const diff = target - now;
            if (diff <= 0) return { isPast: true };
            const s = Math.floor(diff / 1000);
            return {
                isPast: false,
                days: Math.floor(s / 86400),
                hours: Math.floor((s % 86400) / 3600),
                minutes: Math.floor((s % 3600) / 60),
                seconds: s % 60,
                totalSeconds: s
            };
        }

        function formatCountdown(p) {
            return p.isPast ? null : `剩 ${p.days} 天 ${p.hours} 小時 ${p.minutes} 分 ${p.seconds} 秒`;
        }

        function escapeHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }

        function renderAdminList() {
            if (!isLoggedIn) return;
            const container = document.getElementById('adminCountdownList');
            const recurring = getRecurringEventsWithDate();
            const allEvents = [...recurring, ...adminEvents];

            const active = allEvents
                .filter(ev => !getCountdownParts(ev.date).isPast)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            if (!active.length) {
                container.innerHTML = `<div class="empty-state">✨ 目前沒有未過期的倒數事件</div>`;
                return;
            }

            container.innerHTML = active.map(ev => {
                const p = getCountdownParts(ev.date);
                const dateObj = new Date(ev.date + 'T00:00:00');
                const dateDisplay = `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`;
                const recurringTag = ev.recurring ? `<span class="recurring-tag">每年</span>` : '';
                const deleteBtn = ev.recurring ? '' : `<button class="delete-btn" data-id="${ev.id}">刪除</button>`;

                return `
                    <div class="countdown-item ${ev.recurring ? 'recurring-item' : ''}">
                        <div class="event-info">
                            <div class="event-name">📅 ${escapeHtml(ev.name)}${recurringTag}</div>
                            <div class="event-date">${dateDisplay}</div>
                        </div>
                        <div class="live-preview" data-countdown-date="${ev.date}">
                            ${formatCountdown(p)}
                        </div>
                        ${deleteBtn}
                    </div>
                `;
            }).join('');

            document.querySelectorAll('[data-id]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.getAttribute('data-id');
                    if (confirm('確定要刪除這個倒數事件嗎？')) {
                        remove(ref(db, 'events/' + id));
                    }
                });
            });

            startPreviewUpdater();
        }

        let previewInterval = null;
        function startPreviewUpdater() {
            if (previewInterval) clearInterval(previewInterval);
            previewInterval = setInterval(() => {
                if (!isLoggedIn) return;
                let needRerender = false;
                document.querySelectorAll('.live-preview[data-countdown-date]').forEach(el => {
                    const dateStr = el.getAttribute('data-countdown-date');
                    if (!dateStr) return;
                    const parts = getCountdownParts(dateStr);
                    if (parts.isPast) { needRerender = true; return; }
                    const text = formatCountdown(parts);
                    if (text) el.textContent = text;
                });
                if (needRerender) renderAdminList();
            }, 1000);
        }

        function addNewEvent() {
            const nameInput = document.getElementById('eventName');
            const dateInput = document.getElementById('eventDate');
            const name = nameInput.value.trim();
            const date = dateInput.value;

            if (!name) { alert('請輸入事件名稱'); return; }
            if (!date) { alert('請選擇日期'); return; }

            const parts = getCountdownParts(date);
            if (parts.isPast) {
                if (!confirm('這個日期已經過去了，新增後不會顯示。確定要新增嗎？')) return;
            }

            push(eventsRef, { name, date });
            nameInput.value = '';
            dateInput.value = '';
        }

        // ---------- 監聽 Firebase ----------
        onValue(eventsRef, (snapshot) => {
            const data = snapshot.val() || {};
            adminEvents = Object.entries(data).map(([id, val]) => ({ id, ...val, recurring: false }));
            const badge = document.getElementById('statusBadge');
            badge.className = 'status-badge status-online';
            badge.textContent = '● 即時連線';
            renderAdminList();
        }, (error) => {
            const badge = document.getElementById('statusBadge');
            badge.className = 'status-badge status-offline';
            badge.textContent = '● 連線失敗';
            console.error(error);
        });

        // ---------- 事件綁定 ----------
        window.addEventListener('DOMContentLoaded', async () => {
            await checkAndInitAuth();

            document.getElementById('loginBtn').addEventListener('click', login);
            document.getElementById('loginPass').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') login();
            });
            document.getElementById('loginUser').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') document.getElementById('loginPass').focus();
            });
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('changePassBtn').addEventListener('click', changePassword);
            document.getElementById('addBtn').addEventListener('click', addNewEvent);
            document.getElementById('eventName').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); addNewEvent(); }
            });
            document.getElementById('eventDate').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); addNewEvent(); }
            });

            // 若之前已登入（session 內），直接進管理頁
            if (sessionStorage.getItem('admin_logged_in') === 'true') {
                isLoggedIn = true;
                showAdminPage();
            }

            document.getElementById('eventDate').min = new Date().toISOString().split('T')[0];
        });

        window.addEventListener('beforeunload', () => {
            if (previewInterval) clearInterval(previewInterval);
        });
    </script>
</body>
</html>
