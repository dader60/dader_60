<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒數系統</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
        body { background: #cfe8f7; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1.5rem; }
        .public-container { max-width: 900px; width: 100%; background: rgba(255,255,255,0.8); backdrop-filter: blur(16px); border-radius: 2.5rem; padding: 2rem 2.5rem; box-shadow: 0 25px 40px -12px rgba(0,20,30,0.3); border: 1px solid rgba(255,255,255,0.6); }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 0.8rem; }
        h1 { font-size: 2rem; font-weight: 600; color: #1e3b4f; display: flex; align-items: center; gap: 0.75rem; }
        .sync-badge { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: #2d7a4b; background: #e3f5e9; padding: 0.35rem 1rem; border-radius: 30px; font-weight: 600; border: 1px solid #b8e0c4; }
        .sync-dot { width: 8px; height: 8px; background: #2d7a4b; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.5;transform:scale(0.85);} }
        .offline-badge { background: #ffe8e8; color: #b33; border-color: #ffc9c9; }
        .offline-badge .sync-dot { background: #b33; }
        .countdown-list { display: flex; flex-direction: column; gap: 1.2rem; }
        .countdown-card { background: white; border-radius: 1.8rem; padding: 1.5rem 2rem; box-shadow: 0 6px 16px rgba(0,30,50,0.07); border: 1px solid #d4e3ee; display: flex; flex-direction: column; gap: 0.8rem; transition: 0.2s; }
        .countdown-card:hover { transform: translateY(-3px); box-shadow: 0 16px 28px -8px rgba(0,30,50,0.15); }
        .card-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.6rem; }
        .event-name { font-weight: 700; font-size: 1.25rem; color: #0b2a3b; }
        .event-date { font-size: 0.8rem; color: #5b7f97; background: #eef5fb; padding: 0.25rem 1rem; border-radius: 30px; font-weight: 500; }
        .countdown-display { font-family: 'SF Mono', monospace; background: linear-gradient(135deg, #eaf3fa 0%, #dce9f3 100%); padding: 1rem 1.5rem; border-radius: 1.5rem; font-size: 1.3rem; font-weight: 700; color: #17445e; text-align: center; border: 1px solid #c9ddec; }
        .progress-wrap { width: 100%; height: 14px; background: #dce9f3; border-radius: 30px; overflow: hidden; border: 1px solid #c9ddec; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #4a9edb 0%, #1e6fa8 100%); border-radius: 30px; transition: width 0.6s ease; box-shadow: 0 0 8px rgba(30,111,168,0.35); }
        .progress-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: #5b7f97; font-weight: 500; margin-top: 0.2rem; }
        .progress-percent { font-weight: 700; color: #1e6fa8; }
        .empty-state { text-align: center; padding: 3rem 2rem; color: #7b98ab; background: rgba(244,250,255,0.8); border-radius: 2rem; font-size: 1.1rem; border: 1px dashed #c6dae7; }
        .footer-note { text-align: center; margin-top: 2.5rem; font-size: 1rem; color: #5b7f97; letter-spacing: 0.5px; font-weight: 500; }
        .recurring-tag { font-size: 0.7rem; background: #fff4e0; color: #a86a1a; padding: 0.15rem 0.6rem; border-radius: 20px; font-weight: 600; border: 1px solid #ffe0b0; margin-left: 0.4rem; }
        @media (max-width: 600px) {
            .public-container { padding: 1.5rem 1.2rem; border-radius: 1.8rem; }
            h1 { font-size: 1.5rem; }
            .countdown-card { padding: 1.2rem 1.2rem; }
            .event-name { font-size: 1.1rem; }
            .countdown-display { font-size: 1rem; padding: 0.8rem 1rem; }
            .footer-note { font-size: 0.85rem; }
            .progress-wrap { height: 12px; }
        }
    </style>
</head>
<body>
    <div class="public-container">
        <div class="header">
            <h1>⏳ 倒數系統</h1>
            <div id="syncBadge" class="sync-badge">
                <span class="sync-dot"></span>
                <span id="syncText">連線中…</span>
            </div>
        </div>

        <div id="publicCountdownList" class="countdown-list"></div>

        <div class="footer-note">𝓭𝓪𝓭𝓮𝓻 靠北達德速度版 ⚡️｜版主小編團隊製作</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // ========== 您的 Firebase 設定 ==========
        const firebaseConfig = {
            apiKey: "AIzaSyBqxkKFETcINEbnuDN7KxGyqsbdntvPd4c",
            authDomain: "countdown-system-d8ad6.firebaseapp.com",
            databaseURL: "https://countdown-system-d8ad6-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "countdown-system-d8ad6",
            storageBucket: "countdown-system-d8ad6.firebasestorage.app",
            messagingSenderId: "1077561154299",
            appId: "1:1077561154299:web:52f82e19f178e8203cae5e",
            measurementId: "G-SJHM41JX6F"
        };
        // ========================================

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const eventsRef = ref(db, 'events');

        // 固定節日（自動輪迴）
        const RECURRING_EVENTS = [
            { id: 'rec_1', name: '元旦', month: 1, day: 1 },
            { id: 'rec_2', name: '和平紀念日', month: 2, day: 28 },
            { id: 'rec_3', name: '國慶日', month: 10, day: 10 },
            { id: 'rec_4', name: '版主生日', month: 10, day: 10 }
        ];

        let adminEvents = [];

        onValue(eventsRef, (snapshot) => {
            const data = snapshot.val() || {};
            adminEvents = Object.entries(data).map(([id, val]) => ({ id, ...val }));
            setSyncStatus(true);
            renderPublicList();
        }, (error) => {
            setSyncStatus(false);
            console.error(error);
        });

        function setSyncStatus(online) {
            const badge = document.getElementById('syncBadge');
            const text = document.getElementById('syncText');
            if (online) {
                badge.className = 'sync-badge';
                text.textContent = '即時同步中';
            } else {
                badge.className = 'sync-badge offline-badge';
                text.textContent = '連線失敗';
            }
        }

        function getNextRecurringDate(month, day) {
            const now = new Date();
            const year = now.getFullYear();
            let target = new Date(year, month - 1, day, 0, 0, 0);
            if (target <= now) {
                target = new Date(year + 1, month - 1, day, 0, 0, 0);
            }
            return target;
        }

        function getRecurringEventsWithDate() {
            return RECURRING_EVENTS.map(ev => {
                const target = getNextRecurringDate(ev.month, ev.day);
                const y = target.getFullYear();
                const m = String(target.getMonth() + 1).padStart(2, '0');
                const d = String(target.getDate()).padStart(2, '0');
                return {
                    id: ev.id,
                    name: ev.name,
                    date: `${y}-${m}-${d}`,
                    recurring: true
                };
            });
        }

        function getCountdownParts(dateStr) {
            const now = new Date();
            const target = new Date(dateStr + 'T00:00:00');
            const diff = target - now;
            if (diff <= 0) return { isPast: true };
            const s = Math.floor(diff / 1000);
            return {
                isPast: false,
                days: Math.floor(s / 86400),
                hours: Math.floor((s % 86400) / 3600),
                minutes: Math.floor((s % 3600) / 60),
                seconds: s % 60,
                totalSeconds: s
            };
        }

        function formatCountdown(p) {
            return p.isPast ? null : `剩 ${p.days} 天 ${p.hours} 小時 ${p.minutes} 分 ${p.seconds} 秒`;
        }

        function getProgressPercent(totalSeconds) {
            const FULL = 365 * 86400;
            let percent = ((FULL - totalSeconds) / FULL) * 100;
            if (percent < 0) percent = 0;
            if (percent > 100) percent = 100;
            return percent;
        }

        function escapeHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }

        function renderPublicList() {
            const container = document.getElementById('publicCountdownList');
            const recurring = getRecurringEventsWithDate();
            const allEvents = [...recurring, ...adminEvents];

            const active = allEvents
                .filter(ev => !getCountdownParts(ev.date).isPast)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            if (!active.length) {
                container.innerHTML = `<div class="empty-state">✨ 目前沒有進行中的倒數事件</div>`;
                return;
            }

            container.innerHTML = active.map(ev => {
                const p = getCountdownParts(ev.date);
                const dateObj = new Date(ev.date + 'T00:00:00');
                const dateDisplay = `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`;
                const percent = getProgressPercent(p.totalSeconds);
                const percentText = percent.toFixed(1);
                const recurringTag = ev.recurring ? `<span class="recurring-tag">每年</span>` : '';

                return `
                    <div class="countdown-card">
                        <div class="card-header">
                            <div class="event-name">📅 ${escapeHtml(ev.name)}${recurringTag}</div>
                            <div class="event-date">${dateDisplay}</div>
                        </div>
                        <div class="countdown-display" data-date="${ev.date}">${formatCountdown(p)}</div>
                        <div>
                            <div class="progress-wrap">
                                <div class="progress-bar" data-bar-date="${ev.date}" style="width:${percent}%"></div>
                            </div>
                            <div class="progress-info">
                                <span>進度</span>
                                <span class="progress-percent" data-percent-date="${ev.date}">${percentText}%</span>
                            </div>
                        </div>
                    </div>`;
            }).join('');

            startUpdater();
        }

        let interval = null;
        function startUpdater() {
            if (interval) clearInterval(interval);
            interval = setInterval(() => {
                let needRerender = false;
                document.querySelectorAll('.countdown-display[data-date]').forEach(el => {
                    const dateStr = el.getAttribute('data-date');
                    const p = getCountdownParts(dateStr);
                    if (p.isPast) { needRerender = true; return; }
                    el.textContent = formatCountdown(p);

                    const bar = document.querySelector(`.progress-bar[data-bar-date="${dateStr}"]`);
                    const percentEl = document.querySelector(`.progress-percent[data-percent-date="${dateStr}"]`);
                    if (bar) {
                        const percent = getProgressPercent(p.totalSeconds);
                        bar.style.width = percent + '%';
                        if (percentEl) percentEl.textContent = percent.toFixed(1) + '%';
                    }
                });
                if (needRerender) renderPublicList();
            }, 1000);
        }
    </script>
</body>
</html>
