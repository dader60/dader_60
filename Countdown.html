<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒數系統</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
        body { background: #a8d5e5; min-height: 100vh; padding: 2rem 1.5rem 6rem; }

        .public-container { max-width: 1300px; margin: 0 auto; }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 0.8rem; }
        h1 { font-size: 2rem; font-weight: 700; color: #0b2a3b; display: flex; align-items: center; gap: 0.75rem; }
        .sync-badge { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: #1e5a3a; background: #c8ecd6; padding: 0.35rem 1rem; border-radius: 30px; font-weight: 600; border: 1px solid #8fd4a8; }
        .sync-dot { width: 8px; height: 8px; background: #1e5a3a; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.5;transform:scale(0.85);} }
        .offline-badge { background: #ffd6d6; color: #b33; border-color: #ffb0b0; }
        .offline-badge .sync-dot { background: #b33; }

        .countdown-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
        }

        .countdown-card {
            background: #1c1c1c;
            border-radius: 1.5rem;
            padding: 1.8rem 1.8rem 1.5rem;
            box-shadow: 0 12px 30px rgba(0, 20, 30, 0.25);
            border: 1px solid #2e2e2e;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            transition: 0.25s;
        }
        .countdown-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 20, 30, 0.35);
            border-color: #ffc107;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .event-name {
            font-weight: 700;
            font-size: 1.15rem;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.6rem;
        }
        .time-box {
            background: #141414;
            border: 2px solid #f5b301;
            border-radius: 0.9rem;
            padding: 0.7rem 0.3rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.15rem;
        }
        .time-value {
            font-size: 2rem;
            font-weight: 800;
            color: #f5b301;
            line-height: 1;
            font-family: 'SF Mono', 'Fira Code', monospace;
            letter-spacing: -1px;
        }
        .time-label {
            font-size: 0.75rem;
            color: #bdbdbd;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .progress-section { display: flex; flex-direction: column; gap: 0.4rem; }
        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: #bdbdbd;
            font-weight: 500;
        }
        .progress-remaining { color: #e0e0e0; font-weight: 600; }
        .progress-wrap {
            width: 100%;
            height: 10px;
            background: #2e2e2e;
            border-radius: 30px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f5b301 0%, #e8a800 100%);
            border-radius: 30px;
            transition: width 0.6s ease;
            box-shadow: 0 0 8px rgba(245, 179, 1, 0.5);
        }

        .card-message {
            text-align: center;
            font-size: 0.85rem;
            color: #d4b96a;
            font-weight: 500;
            letter-spacing: 0.5px;
            line-height: 1.5;
            margin-top: 0.2rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #0b2a3b;
            background: rgba(255,255,255,0.5);
            border-radius: 2rem;
            font-size: 1.1rem;
            border: 2px dashed rgba(11,42,59,0.2);
            grid-column: 1 / -1;
        }

        /* ===== 固定在底部的頁尾 ===== */
        .footer-note {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 1rem;
            font-size: 1rem;
            color: #0b2a3b;
            letter-spacing: 0.5px;
            font-weight: 600;
            background: rgba(168, 213, 229, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(11, 42, 59, 0.1);
            z-index: 100;
        }

        @media (max-width: 600px) {
            body { padding: 1.2rem 1rem 5rem; }
            h1 { font-size: 1.5rem; }
            .countdown-list { grid-template-columns: 1fr; gap: 1rem; }
            .countdown-card { padding: 1.4rem 1.2rem 1.2rem; }
            .event-name { font-size: 1rem; }
            .time-value { font-size: 1.6rem; }
            .time-label { font-size: 0.7rem; }
            .time-box { padding: 0.55rem 0.2rem 0.4rem; }
            .card-message { font-size: 0.78rem; }
            .footer-note { font-size: 0.85rem; padding: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="public-container">
        <div class="header">
            <h1>⏳ 倒數系統</h1>
            <div id="syncBadge" class="sync-badge">
                <span class="sync-dot"></span>
                <span id="syncText">連線中…</span>
            </div>
        </div>

        <div id="publicCountdownList" class="countdown-list"></div>
    </div>

    <div class="footer-note">𝓭𝓪𝓭𝓮𝓻 靠北達德速度版 ⚡️｜版主小編團隊製作</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // ========== 您的 Firebase 設定 ==========
        const firebaseConfig = {
            apiKey: "AIzaSyBqxkKFETcINEbnuDN7KxGyqsbdntvPd4c",
            authDomain: "countdown-system-d8ad6.firebaseapp.com",
            databaseURL: "https://countdown-system-d8ad6-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "countdown-system-d8ad6",
            storageBucket: "countdown-system-d8ad6.firebasestorage.app",
            messagingSenderId: "1077561154299",
            appId: "1:1077561154299:web:52f82e19f178e8203cae5e",
            measurementId: "G-SJHM41JX6F"
        };
        // ========================================

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const eventsRef = ref(db, 'events');
        const messagesRef = ref(db, 'messages');

        // 固定節日（自動輪迴）
        const RECURRING_EVENTS = [
            { id: 'rec_1', name: '1/1 元旦', type: 'yearly', month: 1, day: 1, emoji: '🎆', defaultMessage: '新年快樂，全新開始！✨', progressDays: 365 },
            { id: 'rec_2', name: '2/28 和平紀念日', type: 'yearly', month: 2, day: 28, emoji: '🕊️', defaultMessage: '和平紀念日，珍惜自由', progressDays: 365 },
            { id: 'rec_3', name: '10/10 國慶日', type: 'yearly', month: 10, day: 10, emoji: '🎉', defaultMessage: '國慶連假放鬆去！🎈', progressDays: 365 },
            { id: 'rec_4', name: '10/10 版主生日', type: 'yearly', month: 10, day: 10, emoji: '🎂', defaultMessage: '生日快樂！Happy Birthday! 🎊', progressDays: 365 },
            { id: 'rec_5', name: '載具發票開獎', type: 'oddMonths', day: 25, emoji: '🧾', defaultMessage: '祝您中大獎！💰', progressDays: 60 }
        ];

        let adminEvents = [];
        let customMessages = {};

        onValue(eventsRef, (snapshot) => {
            const data = snapshot.val() || {};
            adminEvents = Object.entries(data).map(([id, val]) => ({ id, ...val }));
            setSyncStatus(true);
            renderPublicList();
        }, (error) => {
            setSyncStatus(false);
            console.error(error);
        });

        onValue(messagesRef, (snapshot) => {
            customMessages = snapshot.val() || {};
            renderPublicList();
        });

        function setSyncStatus(online) {
            const badge = document.getElementById('syncBadge');
            const text = document.getElementById('syncText');
            if (online) {
                badge.className = 'sync-badge';
                text.textContent = '即時同步中';
            } else {
                badge.className = 'sync-badge offline-badge';
                text.textContent = '連線失敗';
            }
        }

        function getNextYearlyDate(month, day) {
            const now = new Date();
            const year = now.getFullYear();
            let target = new Date(year, month - 1, day, 0, 0, 0);
            if (target <= now) target = new Date(year + 1, month - 1, day, 0, 0, 0);
            return target;
        }

        function getNextOddMonthDate(day) {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;
            for (let offset = 0; offset < 12; offset++) {
                let m = currentMonth + offset;
                let y = currentYear;
                while (m > 12) { m -= 12; y++; }
                if (m % 2 === 0) continue;
                const target = new Date(y, m - 1, day, 0, 0, 0);
                if (target > now) return target;
            }
            return new Date(currentYear + 1, 0, day, 0, 0, 0);
        }

        function getNextRecurringDate(ev) {
            if (ev.type === 'yearly') return getNextYearlyDate(ev.month, ev.day);
            if (ev.type === 'oddMonths') return getNextOddMonthDate(ev.day);
            return null;
        }

        function getRecurringEventsWithDate() {
            return RECURRING_EVENTS.map(ev => {
                const target = getNextRecurringDate(ev);
                if (!target) return null;
                const y = target.getFullYear();
                const m = String(target.getMonth() + 1).padStart(2, '0');
                const d = String(target.getDate()).padStart(2, '0');
                return {
                    id: ev.id,
                    name: ev.name,
                    date: `${y}-${m}-${d}`,
                    recurring: true,
                    emoji: ev.emoji,
                    progressDays: ev.progressDays,
                    defaultMessage: ev.defaultMessage
                };
            }).filter(Boolean);
        }

        function getCountdownParts(dateStr) {
            const now = new Date();
            const target = new Date(dateStr + 'T00:00:00');
            const diff = target - now;
            if (diff <= 0) return { isPast: true };
            const s = Math.floor(diff / 1000);
            return {
                isPast: false,
                days: Math.floor(s / 86400),
                hours: Math.floor((s % 86400) / 3600),
                minutes: Math.floor((s % 3600) / 60),
                seconds: s % 60,
                totalSeconds: s
            };
        }

        function getProgressPercent(totalSeconds, progressDays = 365) {
            const FULL = progressDays * 86400;
            let percent = ((FULL - totalSeconds) / FULL) * 100;
            if (percent < 0) percent = 0;
            if (percent > 100) percent = 100;
            return percent;
        }

        function escapeHtml(s) {
            if (s === undefined || s === null) return '';
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }

        function pad2(n) { return String(n).padStart(2, '0'); }

        function renderPublicList() {
            const container = document.getElementById('publicCountdownList');
            const recurring = getRecurringEventsWithDate();
            const allEvents = [...recurring, ...adminEvents];

            const active = allEvents
                .filter(ev => !getCountdownParts(ev.date).isPast)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            if (!active.length) {
                container.innerHTML = `<div class="empty-state">✨ 目前沒有進行中的倒數事件</div>`;
                return;
            }

            container.innerHTML = active.map(ev => {
                const p = getCountdownParts(ev.date);
                const progressDays = ev.progressDays || 365;
                const percent = getProgressPercent(p.totalSeconds, progressDays);
                const emoji = ev.emoji ? ev.emoji + ' ' : '';

                // 判斷訊息：固定節日優先使用自訂訊息，否則用預設
                let message = '';
                if (ev.recurring) {
                    const custom = customMessages[ev.id];
                    if (custom !== undefined && custom !== null && custom !== '') {
                        message = custom;
                    } else {
                        message = ev.defaultMessage || '';
                    }
                }

                return `
                    <div class="countdown-card">
                        <div class="card-header">
                            <div class="event-name">${emoji}${escapeHtml(ev.name)}</div>
                        </div>
                        <div class="countdown-grid">
                            <div class="time-box">
                                <div class="time-value" data-val="days" data-date="${ev.date}">${p.days}</div>
                                <div class="time-label">天</div>
                            </div>
                            <div class="time-box">
                                <div class="time-value" data-val="hours" data-date="${ev.date}">${pad2(p.hours)}</div>
                                <div class="time-label">時</div>
                            </div>
                            <div class="time-box">
                                <div class="time-value" data-val="minutes" data-date="${ev.date}">${pad2(p.minutes)}</div>
                                <div class="time-label">分</div>
                            </div>
                            <div class="time-box">
                                <div class="time-value" data-val="seconds" data-date="${ev.date}">${pad2(p.seconds)}</div>
                                <div class="time-label">秒</div>
                            </div>
                        </div>
                        <div class="progress-section">
                            <div class="progress-header">
                                <span>進度（${progressDays}天）</span>
                                <span class="progress-remaining">剩 ${p.days} 天</span>
                            </div>
                            <div class="progress-wrap">
                                <div class="progress-bar" data-bar-date="${ev.date}" style="width:${percent}%"></div>
                            </div>
                        </div>
                        ${message ? `<div class="card-message">${escapeHtml(message)}</div>` : ''}
                    </div>`;
            }).join('');

            startUpdater();
        }

        let interval = null;
        function startUpdater() {
            if (interval) clearInterval(interval);
            interval = setInterval(() => {
                let needRerender = false;
                document.querySelectorAll('.time-value[data-date]').forEach(el => {
                    const dateStr = el.getAttribute('data-date');
                    const p = getCountdownParts(dateStr);
                    if (p.isPast) { needRerender = true; return; }

                    const val = el.getAttribute('data-val');
                    if (val === 'days') el.textContent = p.days;
                    else if (val === 'hours') el.textContent = pad2(p.hours);
                    else if (val === 'minutes') el.textContent = pad2(p.minutes);
                    else if (val === 'seconds') el.textContent = pad2(p.seconds);

                    const bar = document.querySelector(`.progress-bar[data-bar-date="${dateStr}"]`);
                    if (bar) {
                        const card = bar.closest('.countdown-card');
                        let progressDays = 365;
                        const recurring = RECURRING_EVENTS.find(r => {
                            const target = getNextRecurringDate(r);
                            if (!target) return false;
                            const y = target.getFullYear();
                            const m = String(target.getMonth() + 1).padStart(2, '0');
                            const d = String(target.getDate()).padStart(2, '0');
                            return `${y}-${m}-${d}` === dateStr;
                        });
                        if (recurring && recurring.progressDays) progressDays = recurring.progressDays;

                        const percent = getProgressPercent(p.totalSeconds, progressDays);
                        bar.style.width = percent + '%';

                        if (card) {
                            const remainEl = card.querySelector('.progress-remaining');
                            if (remainEl) remainEl.textContent = `剩 ${p.days} 天`;
                        }
                    }
                });
                if (needRerender) renderPublicList();
            }, 1000);
        }
    </script>
</body>
</html>
